  <body style="margin:0;background:#020617;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
    <div id="root">
      <div id="croce-oro-boot-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:#020617;color:#f1f5f9;">
        <img src="/icon-192-v2.png?v=5.0.6" alt="Croce Oro" width="72" height="72" style="border-radius:16px;margin-bottom:14px;box-shadow:0 8px 24px rgba(0,0,0,0.45);" />
        <div style="font-size:15px;font-weight:800;letter-spacing:0.04em;color:#fbbf24;">CROCE ORO MASSA CARRARA</div>
        <div id="croce-oro-boot-status" style="margin-top:8px;font-size:13px;color:#cbd5e1;">Avvio Centrale Operativa in corso...</div>
        <div id="croce-oro-boot-error" style="display:none;margin-top:14px;max-width:340px;padding:12px;border-radius:12px;background:#0f172a;border:1px solid rgba(251,191,36,0.45);font-size:12px;color:#fde68a;word-break:break-word;text-align:left;"></div>
        <button id="croce-oro-boot-reset" type="button" style="display:none;margin-top:14px;padding:12px 20px;border:none;border-radius:12px;background:#f59e0b;color:#020617;font-size:14px;font-weight:800;cursor:pointer;">Ripristina Cache e Ricarica</button>
      </div>
    </div>
    <script>
      (function () {
        var shown = false;
        function showBootRecovery(reason) {
          if (window.__CROCE_ORO_APP_MOUNTED__ || shown) return;
          shown = true;
          var statusEl = document.getElementById('croce-oro-boot-status');
          var errEl = document.getElementById('croce-oro-boot-error');
          var btnEl = document.getElementById('croce-oro-boot-reset');
          if (statusEl) {
            statusEl.textContent = 'Caricamento bloccato sul dispositivo. Tocca il pulsante per ripristinare.';
          }
          if (errEl && reason) {
            errEl.textContent = String(reason);
            errEl.style.display = 'block';
          }
          if (btnEl) {
            btnEl.style.display = 'inline-block';
            btnEl.onclick = function () {
              btnEl.disabled = true;
              btnEl.textContent = 'Ripristino in corso...';
              var done = function () {
                var sep = window.location.search ? '&' : '?';
                window.location.replace(window.location.pathname + window.location.search + sep + 'ripristino=' + Date.now());
              };
              try {
                var jobs = [];
                if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
                  jobs.push(
                    navigator.serviceWorker.getRegistrations().then(function (regs) {
                      return Promise.all(regs.map(function (r) { return r.unregister(); }));
                    })
                  );
                }
                if (window.caches && window.caches.keys) {
                  jobs.push(
                    window.caches.keys().then(function (keys) {
                      return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                    })
                  );
                }
                Promise.all(jobs).then(done, done);
              } catch (e) {
                done();
              }
            };
          }
        }
        window.addEventListener('error', function (e) {
          if (!window.__CROCE_ORO_APP_MOUNTED__) {
            showBootRecovery((e && e.message) ? e.message : 'Errore script di avvio');
          }
        });
        window.addEventListener('unhandledrejection', function (e) {
          if (!window.__CROCE_ORO_APP_MOUNTED__) {
            var r = e && e.reason;
            showBootRecovery(r && r.message ? r.message : String(r || 'Errore inizializzazione moduli'));
          }
        });
        window.setTimeout(function () {
          if (!window.__CROCE_ORO_APP_MOUNTED__) {
            showBootRecovery('Timeout avvio applicazione (cache o rete lenta).');
          }
        }, 9000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
